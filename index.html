<!doctype html>
<!--
  lang="pt-BR", e não "en".

  A interface do EduGen é toda em português. Enquanto o documento se declarava
  inglês, o Chrome via a divergência entre o idioma declarado e o texto real e
  traduzia a página automaticamente. O Google Tradutor troca cada nó de texto
  por um elemento <font> — e aí o React perde a referência dos nós que ele
  mesmo criou.

  O sintoma era o app inteiro morrer com "Failed to execute 'insertBefore' on
  'Node'" ao clicar em Editar num módulo: nesse clique o React troca o ícone do
  botão (Pencil → CheckCircle2) e tenta inserir o ícone novo antes do texto
  "Editar" — texto que o tradutor já havia substituído. Reproduzido em
  navegador simulando a mutação do tradutor; a pilha do erro bate exatamente.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduGen AI — Crie cursos com IA</title>
    <meta name="description" content="Crie, publique e venda cursos educacionais completos com inteligência artificial em minutos. Exportação PPTX, SCORM, Moodle e mais." />
    <meta name="author" content="EduGen AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <meta property="og:title" content="EduGen AI — Crie cursos com IA" />
    <meta property="og:description" content="Do tema ao curso completo em minutos. Exportação profissional, tutor IA e analytics." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
