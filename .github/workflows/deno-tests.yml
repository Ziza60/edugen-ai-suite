name: Deno Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run editorial smoke tests
        run: deno test --allow-read supabase/functions/export-pptx-v4/__tests__/editorial.smoke.ts

      - name: Run v5.4.1 fixes smoke tests
        run: deno test --allow-read supabase/functions/export-pptx-v4/__tests__/v541_fixes.smoke.ts

      - name: Run v5.7.1 code completeness smoke tests
        run: deno test --allow-read supabase/functions/export-pptx-v4/__tests__/v571_code_completeness.smoke.ts

      - name: Run v5.7.2 observable outcome smoke tests
        run: deno test --allow-read supabase/functions/export-pptx-v4/__tests__/v572_observable_outcome.smoke.ts
